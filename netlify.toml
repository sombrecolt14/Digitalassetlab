# Static pages served from site/; the Express API runs as one bundled function.
[build]
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These env-var values are public by design (canonical URL, brand name,
  # support email) and appear in the static HTML — tell Netlify's secrets
  # scanner they're expected so the build doesn't fail. The real secrets
  # (SMTP_PASS, RAZORPAY_KEY_SECRET) are never in the output and stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL,FROM_NAME,SMTP_USER,FROM_EMAIL"

# Frontend calls /api/*; Netlify rewrites those to the serverless-wrapped app.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Short, brandable entry points for social bios. Instagram prints the raw URL
# as the link's label whenever its own title field misbehaves, and a visible
# query string reads as clutter on an otherwise clean profile. These keep the
# label short while still handing the UTM tags to analytics on arrival.
# 302, not 301: the campaign tags should stay swappable without fighting a
# permanently cached redirect in someone's browser.
[[redirects]]
  from = "/ig"
  to = "/?utm_source=instagram&utm_medium=bio"
  status = 302

[[redirects]]
  from = "/ig/*"
  to = "/:splat?utm_source=instagram&utm_medium=bio"
  status = 302
